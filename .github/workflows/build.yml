name: build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Fail fast on a malformed patch before spending time on a container
      # build. The build itself asserts that the patch APPLIED and that the
      # resulting option is registered, so this is only the cheap first check.
      - name: Check the patch is well formed
        run: |
          for p in patches/*.patch; do
            echo "== $p"
            git apply --check --numstat "$p" 2>/dev/null \
              || echo "   (cannot check against this tree, the build verifies it)"
            grep -qE '^\+\+\+ b/' "$p" || { echo "   malformed: no +++ b/ header"; exit 1; }
          done

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push profile media service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.profiles
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:profiles-sha-${{ github.sha }}
